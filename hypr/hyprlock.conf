# ~/.config/hypr/hyprlock.conf

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# 1. BACKGROUND
background {
    monitor =
    path = /home/eldion/Pictures/Wallpapers/wallpaperflare.com_wallpaper(2).jpg   # <--- CHANGE THIS!
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 2 # 0 disables blurring
    blur_size = 2
}

# 2. TIME (Big Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -100
    halign = center
    valign = top
}

# 3. DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(186, 194, 222, 1.0)
    font_size = 30
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -300
    halign = center
    valign = top
}

# 4. USER PROFILE PICTURE (Optional)
image {
    monitor =
    path = /home/eldion/.face.icon  # <--- Put a square png here if you want
    size = 150
    border_size = 4
    border_color = rgba(137, 180, 250, 1.0) # Blue
    position = 0, 50
    halign = center
    valign = center
}

# 5. PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(137, 180, 250, 1.0) # Blue border
    inner_color = rgba(30, 30, 46, 1.0)    # Dark background
    font_color = rgba(205, 214, 244, 1.0)  # White text
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}
